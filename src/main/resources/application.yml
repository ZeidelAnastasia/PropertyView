
server:
  port: 8092
  servlet:
    context-path: /property-view

spring:
  application:
    name: property-view

  datasource:
    url: jdbc:h2:mem:property_view_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  h2:
    console:
      enabled: true
      path: /h2-console
